apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  labels:
    app: dagster-webserver
spec:
  # Scaled to zero by default (INF-12): the UI is brought up on demand — see
  # "On-demand Dagster UI" in the repo README. The daemon handles schedules,
  # retries, and run monitoring; it is unaffected by the webserver being down.
  replicas: 0
  selector:
    matchLabels:
      app: dagster-webserver
  template:
    metadata:
      labels:
        app: dagster-webserver
    spec:
      serviceAccountName: dagster
      containers:
        - name: dagster-webserver
          image: rg.nl-ams.scw.cloud/climacterium/pipeline-python:latest
          command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /server_info
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /server_info
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster/dagster_home
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: CATALOG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: user
            - name: CATALOG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: CATALOG_PG_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: host
            - name: CATALOG_PG_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: port
            - name: CATALOG_PG_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: catalog-database
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: host
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: database
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: MINIO_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: endpoint
            - name: MINIO_USE_SSL
              value: "true"
            - name: ADS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: ads-api-key
          volumeMounts:
            - name: dagster-config
              mountPath: /opt/dagster/dagster_home/dagster.yaml
              subPath: dagster.yaml
            - name: dagster-artifacts
              mountPath: /tmp/dagster-artifacts
      volumes:
        - name: dagster-config
          configMap:
            name: dagster-config
        - name: dagster-artifacts
          emptyDir:
            sizeLimit: 256Mi
